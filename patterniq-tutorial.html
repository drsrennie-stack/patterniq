<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatternIQ, How To Read It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E14; --panel:#111820; --panel-2:#18212C; --head:#1B2530;
  --line:#232E3C; --grid:#1A2431;
  --text:#D6E1EC; --dim:#9BAFC4; --faint:#7C90A4;
  --up:#3DD68C; --down:#FF8080; --gold:#E0A93C;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Plus Jakarta Sans",system-ui,sans-serif;
  --label:"DM Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
.skip{position:absolute;left:-9999px;top:0;background:var(--gold);color:#0A0E14;padding:10px 16px;z-index:999;font-weight:700}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}
button{font-family:inherit;font-size:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* header */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);padding:9px 16px;position:sticky;top:0;z-index:50}
.mark{font-weight:800;font-size:16px;letter-spacing:-.01em}
.mark span{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400;margin-left:8px}
.spacer{flex:1}
.prog{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.pbar{width:140px;height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gold);width:0%;transition:width 250ms ease}

/* shell */
.shell{display:grid;grid-template-columns:266px 1fr}
@media (max-width:960px){.shell{grid-template-columns:1fr}}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 0;max-height:calc(100vh - 46px);overflow:auto;position:sticky;top:46px}
@media (max-width:960px){nav.side{position:static;max-height:none}}
nav.side ol{list-style:none;margin:0;padding:0}
.modhead{font-family:var(--label);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:16px 16px 5px;font-weight:700}
nav.side button{display:flex;gap:9px;width:100%;text-align:left;background:none;border:0;padding:6px 16px;cursor:pointer;font-size:13.2px;color:var(--dim);border-left:2px solid transparent;line-height:1.4}
nav.side button:hover{background:var(--panel-2);color:var(--text)}
nav.side button[aria-current="step"]{border-left-color:var(--gold);background:var(--head);color:var(--text);font-weight:700}
nav.side button .no{font-family:var(--mono);font-size:11px;color:var(--faint);flex:0 0 26px}
nav.side button.done .no::after{content:" ✓";color:var(--up)}
main{padding:26px 30px 80px;max-width:920px}

/* type */
.eyebrow{font-family:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 6px}
h1{font-size:29px;font-weight:800;margin:0 0 10px;letter-spacing:-.02em;line-height:1.2}
h2{font-size:18px;font-weight:700;margin:28px 0 8px;letter-spacing:-.01em}
h3{font-family:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:22px 0 7px}
p{margin:0 0 13px}
main ul,main ol.body{margin:0 0 13px;padding-left:20px}
main li{margin:5px 0}
strong{color:#fff;font-weight:700}
code{font-family:var(--mono);font-size:.88em;background:var(--panel-2);padding:1px 5px;border-radius:2px;color:var(--gold)}
a{color:var(--s1)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin:16px 0}
.panel > .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 13px;border-bottom:1px solid var(--line);background:var(--head);flex-wrap:wrap}
.panel > .ph h4{margin:0;font-family:var(--label);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.panel > .pb{padding:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--label);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:2px;border:1px solid;white-space:nowrap}
.badge.real{border-color:var(--s3);color:var(--s3);background:rgba(25,158,112,.09)}
.badge.illus{border-color:var(--gold);color:var(--gold);background:rgba(224,169,60,.09);border-style:dashed}
.badge.unver{border-color:var(--down);color:var(--down)}
.badge.pd{border-color:var(--dim);color:var(--dim)}

/* stat tiles */
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:12px}
.tile .lab{font-family:var(--label);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:0 0 5px;display:block}
.tile .val{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.05;letter-spacing:-.02em;display:block}
.tile .sub{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:5px;display:block}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--faint)}

/* tables */
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
caption{text-align:left;font-size:11.5px;color:var(--faint);padding:0 0 7px}
th,td{padding:6px 10px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
thead th{background:var(--head);font-family:var(--label);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--panel-2)}

/* callouts */
.call{border:1px solid var(--line);border-left:3px solid var(--s1);background:var(--panel-2);padding:12px 14px;border-radius:2px;margin:16px 0;font-size:14px}
.call.warn{border-left-color:var(--gold)}
.call.stop{border-left-color:var(--down)}
.call h4{margin:0 0 5px;font-size:14px}
.call p:last-child{margin-bottom:0}

/* charts */
.chartwrap{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:12px;position:relative}
.chartwrap svg{display:block;width:100%;overflow:visible}
.ctitle{font-family:var(--label);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:0 0 2px}
.csub{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin:0 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:#0A0E14;border:1px solid var(--line);border-radius:3px;padding:6px 9px;font-family:var(--mono);font-size:11.5px;color:var(--text);opacity:0;transition:opacity 120ms;z-index:5;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.tblbtn{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:3px 9px;border-radius:2px;cursor:pointer;font-family:var(--label);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.tblbtn:hover{border-color:var(--gold);color:var(--text)}
.dtable[hidden]{display:none}

/* quiz */
.quiz{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:3px;padding:16px;margin:24px 0}
.quiz .qh{font-family:var(--label);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 8px}
.quiz .qq{font-weight:700;margin:0 0 12px;font-size:15px}
.opts{display:flex;flex-direction:column;gap:7px}
.opts button{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:9px 12px;cursor:pointer;font-size:14px;color:var(--text);line-height:1.45}
.opts button:hover:not(:disabled){border-color:var(--gold)}
.opts button:disabled{cursor:default;opacity:.72}
.opts button.correct{border-color:var(--up);background:rgba(61,214,140,.10);opacity:1}
.opts button.wrong{border-color:var(--down);background:rgba(255,128,128,.10);opacity:1}
.opts button .flag{font-family:var(--mono);font-size:11px;margin-right:7px}
.fb{margin-top:12px;padding:11px 13px;border-radius:2px;font-size:13.5px;background:var(--panel-2);border:1px solid var(--line);display:none}
.fb.show{display:block}
.fb.ok{border-left:3px solid var(--up)}
.fb.no{border-left:3px solid var(--down)}
.fb .verdict{font-weight:700;display:block;margin-bottom:4px}

/* footer nav */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.pager button{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:3px;cursor:pointer;font-size:13.5px}
.pager button:hover:not(:disabled){border-color:var(--gold)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button.next{background:var(--gold);color:#0A0E14;border-color:var(--gold);font-weight:700}
.lesson[hidden]{display:none}
em,i,cite,address,var{font-style:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  nav.side,.topbar,.pager,.tblbtn{display:none}
  body{background:#fff;color:#000}
  .lesson[hidden]{display:block!important}
  main{max-width:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>

<div class="topbar">
  <div class="mark">PatternIQ <span>HOW TO READ IT</span></div>
  <div class="spacer"></div>
  <div class="prog">
    <span id="prog-text">Lesson 1 of 23</span>
    <span class="pbar" role="img" aria-label="Course progress"><i id="pbar-fill"></i></span>
    <span id="score-text">0 / 0 correct</span>
  </div>
</div>

<div class="shell">
  <nav class="side" aria-label="Course contents"><div id="toc"></div></nav>
  <main id="main" tabindex="-1">
    <div aria-live="polite" class="sr" id="announce"></div>
    <div id="lessons"></div>
    <div class="pager">
      <button type="button" id="prev">← Previous</button>
      <button type="button" id="next" class="next">Next →</button>
    </div>
  </main>
</div>

<script>
"use strict";
/* ============================================================
   REAL DATA. Every value below was retrieved from the named
   publisher on 2026-08-11 and cross-checked where a second
   independent source existed. See docs/11-sample-data-provenance.md
   ============================================================ */
const D = {
  pmms: {
    src:"Freddie Mac PMMS", released:"2026-08-06",
    weeks:[["Jul 9",6.49],["Jul 16",6.55],["Jul 23",6.58],["Jul 30",6.66],["Aug 6",6.69]],
    r30:6.69, r30prior:6.66, r30yr:6.63, r15:6.01, r15prior:6.04, r15yr:5.75
  },
  rdc: {
    src:"Realtor.com Monthly Housing Trends", released:"2026-08-03", ref:"July 2026",
    listPrice:428950, listPriceYoY:-2.4,
    active:1126252, activeYoY:2.1,
    newList:423732, newListYoY:0.0,
    dom:57, domYoYdays:-1,
    cuts:20.0, cutsPrior:20.6, cutsYoYpp:-0.6,
    ppsf:226, ppsfYoY:-2.0,
    pendingYoY:1.3, pendingMay:4.1, pendingJun:3.7,
    regionPrice:[["West",-3.9],["South",-2.5],["Northeast",-1.4],["Midwest",0.2]],
    regionInv:[["Midwest",9.3],["Northeast",8.3],["South",-0.2]]
  },
  hist: {
    active:[["Mar",947866],["Apr",1002935],["May",1058693],["Jun",1102615],["Jul",1126252]],
    newList:[["Mar",438938],["Apr",477116],["May",474976],["Jun",463480],["Jul",423732]],
    listPrice:[["Mar",416000],["Apr",425000],["May",429500],["Jun",430000],["Jul",428950]],
    dom:[["Feb",70],["Mar",57],["Apr",52],["May",52],["Jun",53],["Jul",57]]
  },
  bls:{ src:"BLS Employment Situation", released:"2026-08-07", ref:"July 2026", unemp:4.1, payrolls:-23000 },
  census:{ src:"Census and HUD New Residential Construction", released:"2026-07-17", ref:"June 2026",
    permits:1367000, permitsMoM:-3.0, permitsYoY:-2.3,
    starts:1427000, startsMoM:19.0, startsMoE:15.9, startsYoY:3.5,
    completions:1392000, completionsMoM:3.3, completionsYoY:1.5 },
  fhfa:{ src:"FHFA House Price Index", releasedM:"2026-07-28", refM:"May 2026", mom:0.3, yoy:2.2,
    releasedQ:"2026-05-26", refQ:"Q1 2026", qoq:0.5, yoyQ:1.7 },
  lag:[
    ["Mortgage rate, 30-year","Freddie Mac","wk ending Aug 6",0],
    ["Listing metrics","Realtor.com","July",3],
    ["Unemployment rate","BLS","July",7],
    ["Building permits","Census","June",17],
    ["House price index","FHFA","May",58],
    ["County employment and wages","BLS QCEW","Q1",150],
    ["Income, property tax","Census ACS","5-yr window",365],
    ["Insurance premium","Treasury FIO","2018-2022",1320]
  ]
};

/* ============================================================
   CHART HELPERS
   Palette validated with the dataviz skill's checker against
   surface #111820: lightness band, chroma floor, CVD separation,
   normal-vision floor, contrast. All pass.
   Status colors (up green / down red) are reserved and never
   used as a series color.
   ============================================================ */
const NS="http://www.w3.org/2000/svg";
function E(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function fmt(n){return n>=10000?n.toLocaleString("en-US"):String(n);}

let chartSeq=0;
function lineChart(o){
  const id="ch"+(++chartSeq);
  const w=680,h=o.h||210,pl=o.pl||52,pr=18,pt=12,pb=30;
  const svg=E("svg",{viewBox:`0 0 ${w} ${h}`,role:"img","aria-label":o.alt});
  const all=o.series.flatMap(s=>s.data.map(d=>d[1]));
  let min=o.min!==undefined?o.min:Math.min(...all), max=o.max!==undefined?o.max:Math.max(...all);
  const padv=(max-min)*0.15||1; if(o.min===undefined)min-=padv; if(o.max===undefined)max+=padv;
  const rng=max-min||1, n=o.series[0].data.length;
  const X=i=>pl+i*(w-pl-pr)/(n-1), Y=v=>pt+(max-v)/rng*(h-pt-pb);
  for(let g=0;g<=4;g++){const y=pt+(h-pt-pb)*g/4;
    svg.appendChild(E("line",{x1:pl,y1:y,x2:w-pr,y2:y,stroke:"#1A2431","stroke-width":1}));
    const t=E("text",{x:pl-8,y:y+3.5,"text-anchor":"end",fill:"#7C90A4","font-size":"10","font-family":"IBM Plex Mono, monospace"});
    t.textContent=o.fmtY?o.fmtY(max-rng*g/4):(max-rng*g/4).toFixed(o.dec||0); svg.appendChild(t);}
  o.series[0].data.forEach((d,i)=>{const t=E("text",{x:X(i),y:h-9,"text-anchor":"middle",fill:"#7C90A4","font-size":"10","font-family":"IBM Plex Mono, monospace"});t.textContent=d[0];svg.appendChild(t);});
  o.series.forEach(s=>{
    svg.appendChild(E("polyline",{points:s.data.map((d,i)=>X(i)+","+Y(d[1])).join(" "),fill:"none",stroke:s.color,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    s.data.forEach((d,i)=>{svg.appendChild(E("circle",{cx:X(i),cy:Y(d[1]),r:4,fill:s.color,stroke:"#18212C","stroke-width":2}));});
    const last=s.data[s.data.length-1];
    const lt=E("text",{x:X(n-1)+8,y:Y(last[1])+4,fill:s.color,"font-size":"11","font-family":"IBM Plex Mono, monospace","font-weight":"600"});
    lt.textContent=o.fmtLabel?o.fmtLabel(last[1]):last[1]; svg.appendChild(lt);
  });
  const hot=E("g",{}); svg.appendChild(hot);
  const wrap=document.createElement("div"); wrap.className="chartwrap";
  if(o.title){const t=document.createElement("p");t.className="ctitle";t.textContent=o.title;wrap.appendChild(t);}
  if(o.sub){const s=document.createElement("p");s.className="csub";s.textContent=o.sub;wrap.appendChild(s);}
  wrap.appendChild(svg);
  const tip=document.createElement("div"); tip.className="tip"; wrap.appendChild(tip);
  for(let i=0;i<n;i++){
    const r=E("rect",{x:X(i)-(w-pl-pr)/(n-1)/2,y:pt,width:(w-pl-pr)/(n-1),height:h-pt-pb,fill:"transparent"});
    r.addEventListener("mouseenter",()=>{
      tip.style.opacity=1;
      tip.innerHTML=o.series[0].data[i][0]+"<br>"+o.series.map(s=>`<span style="color:${s.color}">■</span> ${s.name}: ${o.fmtLabel?o.fmtLabel(s.data[i][1]):s.data[i][1]}`).join("<br>");
      const pct=X(i)/w; tip.style.left=Math.max(4,Math.min(pct*wrap.clientWidth-40,wrap.clientWidth-140))+"px"; tip.style.top="26px";
    });
    r.addEventListener("mouseleave",()=>{tip.style.opacity=0;});
    hot.appendChild(r);
  }
  if(o.series.length>1){
    const lg=document.createElement("div"); lg.className="legend";
    o.series.forEach(s=>{lg.innerHTML+=`<span><i class="sw" style="background:${s.color}"></i>${s.name}</span>`;});
    wrap.appendChild(lg);
  }
  // table view
  const btnRow=document.createElement("div"); btnRow.style.marginTop="9px";
  const btn=document.createElement("button"); btn.className="tblbtn"; btn.type="button"; btn.textContent="View as table";
  btn.setAttribute("aria-expanded","false"); btnRow.appendChild(btn); wrap.appendChild(btnRow);
  const tbl=document.createElement("div"); tbl.className="dtable"; tbl.hidden=true;
  let html='<table><caption>'+(o.title||"Chart data")+'</caption><thead><tr><th scope="col">Period</th>'+o.series.map(s=>`<th scope="col" class="n">${s.name}</th>`).join("")+'</tr></thead><tbody>';
  o.series[0].data.forEach((d,i)=>{html+=`<tr><th scope="row">${d[0]}</th>`+o.series.map(s=>`<td class="n">${o.fmtLabel?o.fmtLabel(s.data[i][1]):s.data[i][1]}</td>`).join("")+"</tr>";});
  tbl.innerHTML=html+"</tbody></table>"; wrap.appendChild(tbl);
  btn.addEventListener("click",()=>{const open=!tbl.hidden;tbl.hidden=open;btn.setAttribute("aria-expanded",String(!open));btn.textContent=open?"View as table":"Hide table";});
  return wrap;
}

function barChart(o){
  const rows=o.data, rowH=o.rowH||26, w=680, pl=o.pl||186, pr=54, pt=6;
  const h=pt+rows.length*rowH+8;
  const svg=E("svg",{viewBox:`0 0 ${w} ${h}`,role:"img","aria-label":o.alt});
  const vals=rows.map(r=>r[1]);
  const max=Math.max(...vals.map(Math.abs))||1;
  const hasNeg=vals.some(v=>v<0);
  const zx=hasNeg?pl+(w-pl-pr)*0.34:pl;
  const scale=hasNeg?(w-pl-pr)*0.62/max:(w-pl-pr)/max;
  rows.forEach((r,i)=>{
    const y=pt+i*rowH;
    const t=E("text",{x:pl-10,y:y+rowH/2+4,"text-anchor":"end",fill:"#9BAFC4","font-size":"11.5","font-family":"IBM Plex Mono, monospace"});
    t.textContent=r[0]; svg.appendChild(t);
    const v=r[1], bw=Math.abs(v)*scale;
    const col=o.color||(v<0?"#d95926":"#3987e5");
    svg.appendChild(E("rect",{x:v<0?zx-bw:zx,y:y+4,width:Math.max(bw,1.5),height:rowH-12,fill:col,rx:2}));
    const vt=E("text",{x:(v<0?zx-bw-7:zx+bw+7),y:y+rowH/2+4,"text-anchor":v<0?"end":"start",fill:"#D6E1EC","font-size":"11.5","font-family":"IBM Plex Mono, monospace","font-weight":"600"});
    vt.textContent=o.fmtV?o.fmtV(v):v; svg.appendChild(vt);
  });
  if(hasNeg) svg.appendChild(E("line",{x1:zx,y1:pt,x2:zx,y2:h-6,stroke:"#7C90A4","stroke-width":1}));
  const wrap=document.createElement("div"); wrap.className="chartwrap";
  if(o.title){const t=document.createElement("p");t.className="ctitle";t.textContent=o.title;wrap.appendChild(t);}
  if(o.sub){const s=document.createElement("p");s.className="csub";s.textContent=o.sub;wrap.appendChild(s);}
  wrap.appendChild(svg);
  const btnRow=document.createElement("div"); btnRow.style.marginTop="9px";
  const btn=document.createElement("button"); btn.className="tblbtn"; btn.type="button"; btn.textContent="View as table"; btn.setAttribute("aria-expanded","false");
  btnRow.appendChild(btn); wrap.appendChild(btnRow);
  const tbl=document.createElement("div"); tbl.className="dtable"; tbl.hidden=true;
  tbl.innerHTML='<table><caption>'+(o.title||"Chart data")+'</caption><thead><tr><th scope="col">Item</th><th scope="col" class="n">Value</th></tr></thead><tbody>'+
    rows.map(r=>`<tr><th scope="row">${r[0]}</th><td class="n">${o.fmtV?o.fmtV(r[1]):r[1]}</td></tr>`).join("")+"</tbody></table>";
  wrap.appendChild(tbl);
  btn.addEventListener("click",()=>{const open=!tbl.hidden;tbl.hidden=open;btn.setAttribute("aria-expanded",String(!open));btn.textContent=open?"View as table":"Hide table";});
  return wrap;
}

function tile(label,val,sub,cls){
  return `<div class="tile"><span class="lab">${label}</span><span class="val ${cls||""}">${val}</span><span class="sub">${sub||""}</span></div>`;
}

 {name:"1 · Orientation", lessons:[
  {t:"What PatternIQ is, and four things it will not do",
   html:`
<p>PatternIQ is a research instrument. It reads public housing and economic data, organises it into a picture of a local market, tells you how strong the evidence behind that picture is, and teaches you to read it yourself.</p>
<p>It is not a recommendation engine. That distinction is not modesty, it is architecture. Four refusals are built into the product and you should hold it to them.</p>
<div class="call"><h4>The four refusals</h4>
<ol class="body">
<li><strong>It will not give you a number when the evidence is thin.</strong> Markets that fail a publication gate show as withheld, with the gate named, rather than getting a plausible-looking score.</li>
<li><strong>It will not tell you what usually happens next until it has checked.</strong> A pattern that has not been backtested says so, and its confidence is capped low enough that you cannot lean on it.</li>
<li><strong>It will not blur a fact into a prediction.</strong> Every claim is typed: fact, inference, pattern, or prediction. They are displayed differently and never mixed.</li>
<li><strong>It will not hide what it cannot see.</strong> There is no free national foreclosure data. Every market in the country carries a permanent confidence penalty for that, stated on screen.</li>
</ol></div>
<p>The reason to start here is that the rest of this course is mostly about uncertainty, and that will feel like pessimism unless you understand what it buys you. A tool that says "62.4" about every market in America is easy to build and impossible to trust. A tool that scores 1,847 markets, withholds 2,214, and tells you exactly why, is the harder thing and the useful one.</p>
`,

<div class="call"><p style="font-size:16px;margin:0"><strong>Show the evidence. Explain the pattern. Quantify uncertainty. Teach the investor. Track the outcome. Learn from the outcome.</strong></p></div>

<p>The last two are the ones people skip, and they are the ones that compound. A market score is a guess about the world. A record of your own last eleven projects is a fact about you.</p>

  {t:"Opportunity and Confidence are two different questions",
   html:`
<p>This is the single most important idea in the product, and the one most likely to be collapsed by a hurried reader.</p>
<ul>
<li><strong>Opportunity</strong> answers: given what we can see, how favourable does this market look relative to comparable markets?</li>
<li><strong>Confidence</strong> answers: how much of the picture are we actually seeing, and how good is it?</li>
</ul>
<p>They are computed independently and never blended. Four combinations, four different actions.</p>
<div class="grid g2">
<div class="tile"><span class="lab">High opportunity · High confidence</span><span class="val" style="font-size:17px">Investigate properly</span><span class="sub">The evidence is strong and it points somewhere. This is the rare one.</span></div>
<div class="tile"><span class="lab">High opportunity · Low confidence</span><span class="val" style="font-size:17px">The trap</span><span class="sub">Looks exciting because you are seeing a fraction of the picture. Thin data produces extreme scores.</span></div>
<div class="tile"><span class="lab">Moderate opportunity · High confidence</span><span class="val" style="font-size:17px">Often the better market</span><span class="sub">Unexciting and solid. Most durable money is made here.</span></div>
<div class="tile"><span class="lab">Low opportunity · Low confidence</span><span class="val" style="font-size:17px">Ignore</span><span class="sub">Nothing to see and no ability to see it.</span></div>
</div>
<div class="call warn"><h4>Why thin data produces extreme scores</h4>
<p>Opportunity is a percentile rank within a peer set. When a market has only a handful of transactions, its metrics swing violently, and a violent swing lands in the tail of the distribution. The score is not high because the market is good. It is high because the measurement is noisy. Confidence is what tells you which one you are looking at, and it is the reason the two numbers must never be averaged.</p></div>
`,
   q:{q:"Two markets: A scores 81 opportunity / 44 confidence. B scores 58 opportunity / 79 confidence. Which is the better candidate for your next flip, and why?",
